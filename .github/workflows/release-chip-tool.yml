name: Build Matter chip-tool image

run-name: >-
  chip-tool
  (${{ inputs.connectedhomeip_ref }})

on:
  workflow_dispatch:
    inputs:
      connectedhomeip_ref:
        description: connectedhomeip git ref used to build chip-tool
        required: true
        default: v1.5.0.1
        type: string
      chip_build_image:
        description: Upstream Matter build environment image
        required: true
        default: ghcr.io/project-chip/chip-build:182
        type: string
      push_latest:
        description: Also publish latest for the chip-tool artifact image
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: matter-chip-tool-${{ github.event.repository.full_name }}
  cancel-in-progress: false

jobs:
  build-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Require default branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Releases must be triggered from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi

      - name: Reclaim runner disk space before chip-tool build
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Build chip-tool in upstream build environment
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/matter-chip-tool-build"
          DIST_ROOT="$RUNNER_TEMP/matter-chip-tool-dist"
          rm -rf "$BUILD_ROOT" "$DIST_ROOT"
          mkdir -p "$BUILD_ROOT" "$DIST_ROOT"
          docker run --rm \
            -e CONNECTEDHOMEIP_REF="${{ inputs.connectedhomeip_ref }}" \
            -v "$BUILD_ROOT:/work" \
            -v "$DIST_ROOT:/dist" \
            "${{ inputs.chip_build_image }}" \
            /bin/bash -lc '
              set -eo pipefail
              cd /work
              git clone --depth 1 --branch "${CONNECTEDHOMEIP_REF}" --recurse-submodules --shallow-submodules \
                https://github.com/project-chip/connectedhomeip.git connectedhomeip
              cd connectedhomeip
              bash ./scripts/bootstrap.sh
              ./scripts/run_in_build_env.sh "./scripts/build/build_examples.py --target linux-x64-chip-tool build"
              install -Dm755 out/linux-x64-chip-tool/chip-tool /dist/chip-tool/chip-tool
              rm -rf out
            '
          test -f "$DIST_ROOT/chip-tool/chip-tool"

      - name: Upload chip-tool binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: chip-tool-binary
          path: ${{ runner.temp }}/matter-chip-tool-dist/chip-tool/chip-tool
          if-no-files-found: error
          retention-days: 7

  package-image:
    runs-on: ubuntu-latest
    needs: build-binary

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Download chip-tool binary artifact
        uses: actions/download-artifact@v4
        with:
          name: chip-tool-binary
          path: dist/chip-tool

      - name: Verify downloaded chip-tool artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/chip-tool/chip-tool
          chmod +x dist/chip-tool/chip-tool

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.5.0
        with:
          username: piphinetwork
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare chip-tool image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: piphinetwork/matter-chip-tool
          tags: |
            type=raw,value=${{ inputs.connectedhomeip_ref }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
          labels: |
            org.opencontainers.image.title=Matter chip-tool artifact
            org.opencontainers.image.description=Prebuilt chip-tool binary artifact image for PiPhi Matter sidecar builds.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.connectedhomeip_ref }}

      - name: Build and push chip-tool image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.chip-tool
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=matter-chip-tool-image
          cache-to: type=gha,mode=min,scope=matter-chip-tool-image

      - name: Pin recommended chip-tool image reference
        shell: bash
        run: |
          set -euo pipefail
          PINNED_IMAGE="piphinetwork/matter-chip-tool@${{ steps.build.outputs.digest }}"
          echo "$PINNED_IMAGE" > .github/matter-chip-tool-image.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/matter-chip-tool-image.txt
          if git diff --cached --quiet; then
            echo "Pinned chip-tool image reference already up to date."
            exit 0
          fi
          git commit -m "build: pin chip-tool artifact ${PINNED_IMAGE}"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Release summary
        shell: bash
        run: |
          echo "Published piphinetwork/matter-chip-tool:${{ inputs.connectedhomeip_ref }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            echo "Published piphinetwork/matter-chip-tool:latest" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Pinned artifact image: piphinetwork/matter-chip-tool@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build image: ${{ inputs.chip_build_image }}" >> "$GITHUB_STEP_SUMMARY"
