[build-system]
requires = ["pdm-backend>=2.4.0"]
build-backend = "pdm.backend"

[project]
name = "piphi-network-matter"
version = "0.1.0"
description = "PiPhi runtime sidecar for Matter and Thread devices."
authors = [
    {name = "PiPhi Network", email = "support@piphi.io"},
    {name = "KelvinSan", email = "kelvin.sanyaolu@gmail.com"},
]
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "piphi-runtime-kit-python[fastapi]==0.7.1",
    "uvicorn>=0.32.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"

[tool.pdm.scripts]
matter = "python -m piphi_network_matter"
matter-controller-bridge = "python -m piphi_network_matter.controller.bridge_cli"
release-version = "python scripts/release.py"
release-github = "python scripts/create_github_release.py"
matter-release-github = "python scripts/create_github_release.py"
test = "pytest"

[project.scripts]
piphi-matter-controller = "piphi_network_matter.controller.bridge_cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "piphi-runtime-testkit-python>=0.1.3,<0.2.0",
    "pytest>=8.3.0",
]
